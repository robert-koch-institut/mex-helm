apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup-users
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rustfs-rc-setup
          image: rustfs/rc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "==> Waiting for RustFS service to become reachable..."
              until rc alias set local http://{{ .Release.Name }}-rustfs-svc:9000 "$ROOT_USER" "$ROOT_PASSWORD"; do
                echo "RustFS not ready yet. Retrying in 3 seconds..."
                sleep 3
              done

              echo "==> Creating default buckets..."
              rc mb local/mex-etl-dev || true
              rc mb local/mex-etl-local || true

              echo "==> Creating application user: $APP_USER"
              rc admin user add local "$APP_USER" "$APP_SECRET" || true

              echo "==> Creating custom bucket policy..."
              cat <<EOF > /tmp/mex-extractors-rw-policy.json
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:PutObject",
                      "s3:GetObject",
                      "s3:DeleteObject",
                      "s3:ListBucket"
                    ],
                    "Resource": [
                      "arn:aws:s3:::mex-etl-dev",
                      "arn:aws:s3:::mex-etl-dev/*",
                      "arn:aws:s3:::mex-etl-local",
                      "arn:aws:s3:::mex-etl-local/*"
                    ]
                  }
                ]
              }
              EOF

              rc admin policy create local mex-extractors-rw-policy /tmp/mex-extractors-rw-policy.json || true

              echo "==> Attaching policy to user..."
              rc admin policy attach local mex-extractors-rw-policy --user "$APP_USER"

              echo "==> Post-install configuration complete!"
          env:
            - name: ROOT_USER
              value: {{ .Values.rustfs.secret.rustfs.access_key | quote }}
            - name: ROOT_PASSWORD
              value: {{ .Values.rustfs.secret.rustfs.secret_key | quote }}
            - name: APP_USER
              value: {{ .Values.appCredentials.user | quote }}
            - name: APP_SECRET
              value: {{ .Values.appCredentials.secret | quote }}
