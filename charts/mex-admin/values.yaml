replicaCount: 1
image:
  repository: ghcr.io/robert-koch-institut/mex-admin
  tag: "4.7.0"

service:
  type: ClusterIP
  frontend:
    port: 8030
  api:
    port: 8031

ingress:
  enabled: false
  className:
  host:

frontend:
  env:
    MEX_ADMIN_FRONTEND_HOST: 0.0.0.0
    MEX_ADMIN_API_PORT: "80"
  path: "/"

api:
  env:
    MEX_ADMIN_DIRECTORY: data
    MEX_ADMIN_API_HOST: 0.0.0.0
  path: "/"
