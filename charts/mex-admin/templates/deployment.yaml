apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["admin-frontend"]
          ports:
            - containerPort: 8030
          {{- if .Values.configMapData }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          {{- end }}
          {{- if .Values.frontend.env }}
          env:
            {{- if .Values.ingress.enabled }}
            - name: REFLEX_DEPLOY_URL
              value: "http://{{ .Values.ingress.host }}"
            - name: REFLEX_API_URL
              value: "http://api-{{ .Values.ingress.host }}"
            {{- end }}
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | toJson }}
            {{- end }}
          {{- end }}

        - name: {{ .Release.Name }}-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["admin-api"]
          ports:
            - containerPort: 8031
          {{- if .Values.configMapData }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          {{- end }}
          {{- if .Values.api.env }}
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | toJson }}
            {{- end }}
          {{- end }}
