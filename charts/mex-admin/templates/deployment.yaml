apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["admin-frontend"]
          ports:
            - containerPort: 8030
          env:
            {{- if .Values.ingress.enabled }}
            - name: REFLEX_DEPLOY_URL
              value: "http://{{ .Values.ingress.hostName }}"
            - name: REFLEX_API_URL
              value: "http://api-{{ .Values.ingress.hostName }}"
            {{- end }}
            - name: MEX_ADMIN_FRONTEND_HOST
              value: "0.0.0.0"


        - name: {{ .Release.Name }}-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["admin-api"]
          ports:
            - containerPort: 8031
          env:
            - name: MEX_ADMIN_API_HOST
              value: "0.0.0.0"
            - name: MEX_ADMIN_USER_DATABASE
              value: {{ .Values.admin.userDatabase | quote }}
            - name: MEX_BACKEND_API_KEY
              value: {{ .Values.mex.backend.apiKey }}
            - name: MEX_BACKEND_API_URL
              value: {{ .Values.mex.backend.apiUrl }}
