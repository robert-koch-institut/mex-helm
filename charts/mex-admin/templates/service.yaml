apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8030
      targetPort: 8030
      protocol: TCP
      name: frontend
    - port: 8031
      targetPort: 8031
      protocol: TCP
      name: api
  selector:
    app: {{ .Release.Name }}
