apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: 8030
      protocol: TCP
      name: frontend
    - port: {{ .Values.service.api.port }}
      targetPort: 8031
      protocol: TCP
      name: api
  selector:
    app: {{ .Release.Name }}
