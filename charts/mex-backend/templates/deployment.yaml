apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["backend"]
          ports:
            - containerPort: 8080
          env:
            - name: MEX_BACKEND_HOST
              value: "0.0.0.0"
            - name: MEX_GRAPH_URL
              value: {{ .Values.backend.graphUrl }}
            - name: MEX_BACKEND_IDENTITY_PROVIDER
              value: {{ .Values.backend.identityProvider }}
            - name: MEX_BACKEND_API_KEY_DATABASE
              value: {{ .Values.backend.apiKey | quote }}
