{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pvc
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  
  {{- with .Values.persistence.className }}
  storageClassName: {{ . }}
  {{- end }}

  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
