{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ing
spec:

  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}

  rules:
    - host: {{ .Values.ingress.hostName }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: 8020

    - host: "api-{{ required "ingress.hostName needs to be set." .Values.ingress.hostName }}"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: 8021
{{- end }}
