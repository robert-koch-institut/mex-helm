apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8020
      targetPort: 8020
      protocol: TCP
      name: frontend
    - port: 8021
      targetPort: 8021
      protocol: TCP
      name: api
  selector:
    app: {{ .Release.Name }}
